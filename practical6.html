<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>

    <style>
        body {
            font-family: Arial;
            background-color: #27d924;
            text-align: center;
        }

        .container {
            width: 550px;
            margin: 50px auto;
            background: rgb(13, 60, 203);
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            color: white;
        }

        input {
            padding: 10px;
            margin: 5px;
            border: none;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            margin: 8px 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #9bb227;
        }

        button:hover {
            background-color: #b92396;
            color: white;
        }

        .product {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin: 8px;
            background-color: #afb80d;
            border-radius: 5px;
            color: white;
        }

        .remove {
            background-color: red;
            color: white;
            margin: 0;
        }

        #total {
            font-size: 20px;
            font-weight: bold;
            color: white;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🛒 Shopping Cart</h1>

    <!-- Input for any product -->
    <input type="text" id="itemName" placeholder="Enter item name">

    <input type="number" id="itemPrice" placeholder="Enter price">

    <br>

    <button onclick="addItem()">Add Item</button>
    <button onclick="calculateTotal()">Calculate Total</button>

    <div id="cart"></div>

    <div id="total"></div>

</div>

<script>

  
    let products = [];

  
    function addItem() {

        let name = document.getElementById("itemName").value;
        let price = Number(document.getElementById("itemPrice").value);

        if (name == "" || price <= 0) {
            alert("Please enter item name and price");
            return;
        }

        products.push({
            id: Date.now(),
            name: name,
            price: price
        });

        document.getElementById("itemName").value = "";
        document.getElementById("itemPrice").value = "";

        displayProducts();
    }

   
    function displayProducts() {

        let output = products.map(function(product) {

            return `
                <div class="product">
                    <span>
                        ${product.name} - ₹${product.price}
                    </span>

                    <button class="remove"
                        onclick="removeItem(${product.id})">
                        Remove
                    </button>
                </div>
            `;

        });

        document.getElementById("cart").innerHTML =
            output.join("");
    }

    
    function removeItem(id) {

        products = products.filter(function(product) {
            return product.id != id;
        });

        displayProducts();
        calculateTotal();
    }

   
    function calculateTotal() {

        let total = products.reduce(function(sum, product) {
            return sum + product.price;
        }, 0);

        document.getElementById("total").innerHTML =
            "Total Price: ₹" + total;
    }

</script>

</body>
</html>
