
<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #17ae44;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calculator {
            width: 320px;
            background: #222;
            padding: 20px;
            border-radius: 15px;
        }

        #display {
            width: 100%;
            height: 70px;
            box-sizing: border-box;
            font-size: 30px;
            text-align: right;
            padding: 10px;
            margin-bottom: 15px;
            border: none;
            border-radius: 8px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;
            font-size: 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }

        .operator {
            background: rgb(33, 212, 87);
        }

        .clear {
            background: red;
            color: rgb(180, 204, 24);
        }

        .equal {
            background: green;
            color: rgb(182, 206, 26);
        }

        .special {
            background: #20148a;
            color: rgb(207, 198, 23);
        }
    </style>
</head>

<body>

<div class="calculator">

    <input type="text" id="display" value="0" readonly>

    <div class="buttons">

        <button class="clear" onclick="clearDisplay()">AC</button>
        <button class="special" onclick="deleteLast()">DEL</button>
        <button class="special" onclick="percentage()">%</button>
        <button class="operator" onclick="addValue('/')">/</button>

        <button onclick="addValue('7')">7</button>
        <button onclick="addValue('8')">8</button>
        <button onclick="addValue('9')">9</button>
        <button class="operator" onclick="addValue('*')">*</button>

        <button onclick="addValue('4')">4</button>
        <button onclick="addValue('5')">5</button>
        <button onclick="addValue('6')">6</button>
        <button class="operator" onclick="addValue('-')">−</button>

        <button onclick="addValue('1')">1</button>
        <button onclick="addValue('2')">2</button>
        <button onclick="addValue('3')">3</button>
        <button class="operator" onclick="addValue('+')">+</button>

        <button onclick="addValue('00')">00</button>
        <button onclick="addValue('0')">0</button>
        <button onclick="addValue('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>

    </div>
</div>

<script>

let display = document.getElementById("display");

function addValue(value) {

    if (display.value === "0" || display.value === "Error") {
        display.value = value;
    } 
    else {
        display.value += value;
    }
}

function clearDisplay() {
    display.value = "0";
}

function deleteLast() {

    if (display.value.length > 1) {
        display.value = display.value.slice(0, -1);
    } 
    else {
        display.value = "0";
    }
}

function percentage() {

    let value = parseFloat(display.value);

    if (!isNaN(value)) {
        display.value = value / 100;
    }
}

function calculate() {

    try {

        let expression = display.value;

        // Prevent invalid characters
        if (!/^[0-9+\-*/.]+$/.test(expression)) {
            display.value = "Error";
            return;
        }

        let result = eval(expression);

        if (!isFinite(result)) {
            display.value = "Error";
        } 
        else {
            display.value = result;
        }

    } 
    catch {
        display.value = "Error";
    }
}


// Keyboard support
document.addEventListener("keydown", function(event) {

    let key = event.key;

    if ("0123456789+-*/.".includes(key)) {
        addValue(key);
    }

    else if (key === "Enter" || key === "=") {
        calculate();
    }

    else if (key === "Backspace") {
        deleteLast();
    }

    else if (key === "Escape") {
        clearDisplay();
    }

    else if (key === "%") {
        percentage();
    }

});

</script>

</body>
</html>
